name: 更新源索引

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成 Packages 索引
        run: python3 update_packages.py

      - name: 生成 Packages.gz（Cydia 兼容）
        run: gzip -9 -c Packages > Packages.gz

      - name: 提交索引
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.bz2 Packages.gz
          if git diff --staged --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "🤖 自动更新索引"
            git push
          fi
