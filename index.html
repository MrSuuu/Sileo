<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060a">
<title>泽哥源 · 个人越狱插件源</title>
<meta name="description" content="泽哥有道理的个人越狱插件源 — Liquid Glass 系列等插件，适配 roothide / rootless / iOS 17+。">
<meta property="og:title" content="泽哥源 · 个人越狱插件源">
<meta property="og:description" content="Liquid Glass 系列等插件，适配 roothide / rootless / iOS 17+。">
<link rel="apple-touch-icon" href="CydiaIcon.png">
<link rel="icon" href="CydiaIcon.png">
<style>
  :root {
    --bg: #05060a;
    --card: rgba(255,255,255,.055);
    --card-border: rgba(255,255,255,.10);
    --text: #f2f3f7;
    --text-dim: rgba(242,243,247,.62);
    --text-faint: rgba(242,243,247,.38);
    --accent1: #5b7cff;
    --accent2: #ad4df5;
    --accent3: #f950b0;
    --radius: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
  }
  /* 背景网格渐变（液态玻璃质感） */
  .bg {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
  }
  .bg::before, .bg::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5;
  }
  .bg::before { width: 70vw; height: 70vw; left: -18vw; top: -22vw;
    background: radial-gradient(circle at 30% 30%, #2b3d8f, transparent 65%); }
  .bg::after { width: 80vw; height: 80vw; right: -28vw; top: 18vh;
    background: radial-gradient(circle at 60% 40%, #6a2b8f, transparent 65%); }
  .bg .third { position: absolute; width: 60vw; height: 60vw; left: 10vw; bottom: -30vw;
    border-radius: 50%; filter: blur(100px); opacity: .35;
    background: radial-gradient(circle at 50% 50%, #8f2b6a, transparent 65%); }

  .wrap { max-width: 680px; margin: 0 auto; padding: 40px 20px 56px; }

  /* ── 头部 ── */
  header { text-align: center; padding: 24px 0 8px; }
  .icon {
    width: 92px; height: 92px; border-radius: 24px;
    box-shadow: 0 12px 40px rgba(91,124,255,.35), 0 2px 10px rgba(0,0,0,.5);
    border: 1px solid rgba(255,255,255,.16);
  }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: -.02em; margin: 18px 0 6px; }
  .tagline { color: var(--text-dim); font-size: 15px; margin: 0; }
  .badges { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 14px 0 0; }
  .badge {
    font-size: 12px; color: var(--text-dim); padding: 5px 11px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--card-border);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }

  /* ── 添加源卡片 ── */
  .add-card {
    margin: 26px 0 10px; padding: 18px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--card-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .url-box {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--text-dim);
    background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.07);
    padding: 11px 13px; border-radius: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all;
  }
  .url-box svg { flex: none; }
  .btn-primary {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; margin-top: 12px; padding: 15px; border: 0; cursor: pointer;
    border-radius: 15px; font-size: 17px; font-weight: 700; color: #fff; text-decoration: none;
    background: linear-gradient(135deg, var(--accent1), var(--accent2) 55%, var(--accent3));
    box-shadow: 0 10px 30px rgba(120,80,255,.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-primary:active { transform: scale(.97); box-shadow: 0 6px 20px rgba(120,80,255,.3); }
  .btn-primary.irisin {
    background: linear-gradient(135deg, #0fd6bd, #22a7ff 55%, #5b7cff);
    box-shadow: 0 10px 30px rgba(34,167,255,.35);
  }
  .btn-primary.irisin:active { box-shadow: 0 6px 20px rgba(34,167,255,.28); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-ghost {
    flex: 1; text-align: center; padding: 11px 8px; font-size: 13px; font-weight: 600;
    color: var(--text-dim); text-decoration: none; cursor: pointer;
    background: rgba(255,255,255,.05); border: 1px solid var(--card-border);
    border-radius: 12px; transition: background .15s ease;
  }
  .btn-ghost:active { background: rgba(255,255,255,.12); }
  .hint { display: none; margin-top: 10px; font-size: 12.5px; color: var(--text-faint); text-align: center; }
  .hint.show { display: block; }

  /* ── 插件列表 ── */
  .section-title {
    margin: 34px 4px 14px; font-size: 13px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--text-faint);
  }
  .cards { display: grid; gap: 12px; }
  @media (min-width: 640px) { .cards { grid-template-columns: 1fr 1fr; } }
  .pkg {
    padding: 16px; border-radius: var(--radius); text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--card-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    transition: transform .15s ease, background .15s ease;
    display: flex; flex-direction: column; gap: 8px;
  }
  .pkg:active { transform: scale(.985); }
  @media (hover: hover) { .pkg:hover { background: rgba(255,255,255,.09); } }
  .pkg-head { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; color: #fff;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .pkg-name { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; }
  .pkg-id { font-size: 11.5px; color: var(--text-faint); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .pkg-desc { font-size: 13px; color: var(--text-dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    color: rgba(255,255,255,.85); background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.09);
  }
  .chip.acc { background: rgba(91,124,255,.22); border-color: rgba(91,124,255,.35); color: #c7d4ff; }
  .loading, .error { color: var(--text-faint); font-size: 13.5px; text-align: center; padding: 24px 0; }
  .error a { color: #a8b8ff; }

  /* ── 页脚 ── */
  footer { margin-top: 44px; text-align: center; color: var(--text-faint); font-size: 12.5px; }
  footer a { color: var(--text-dim); text-decoration: none; }
  footer a:hover { color: var(--text); }

  /* ── Toast ── */
  #toast {
    position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 20px);
    background: rgba(40,42,52,.92); border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: #fff; font-size: 13.5px; padding: 11px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 10;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="bg"><div class="third"></div></div>

<div class="wrap">
  <header>
    <img class="icon" src="CydiaIcon.png" alt="泽哥源图标">
    <h1>泽哥源</h1>
    <p class="tagline">泽哥有道理的个人越狱插件源</p>
    <div class="badges">
      <span class="badge">roothide ✓</span>
      <span class="badge">rootless ✓</span>
      <span class="badge">iOS 17+</span>
    </div>
  </header>

  <section class="add-card">
    <div class="url-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span id="src-url">https://MrSuuu.github.io/Sileo</span>
    </div>
    <a class="btn-primary" id="add-sileo" href="sileo://source/https://MrSuuu.github.io/Sileo">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加到 Sileo
    </a>
    <a class="btn-primary irisin" id="add-irisin" href="irisin://repository/add?url=https://MrSuuu.github.io/Sileo">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加到 Irisin
    </a>
    <div class="btn-row">
      <a class="btn-ghost" href="zbra://sources/add/https://MrSuuu.github.io/Sileo">Zebra</a>
      <a class="btn-ghost" href="cydia://url/https://cydia.saurik.com/api/share#?source=https://MrSuuu.github.io/Sileo">Cydia</a>
      <a class="btn-ghost" id="copy-btn" href="javascript:void(0)">复制地址</a>
    </div>
    <div class="hint" id="add-hint"></div>
  </section>

  <div class="section-title">插件</div>
  <div class="cards" id="pkg-list">
    <div class="loading">正在加载插件列表…</div>
  </div>

  <footer>
    由 <a href="https://github.com/MrSuuu">泽哥有道理</a> 维护 ·
    <a href="https://github.com/MrSuuu/Sileo">GitHub</a>
  </footer>
</div>

<div id="toast">已复制源地址</div>

<script>
(function () {
  'use strict';

  /* ── 添加源按钮：点了先跳，1.6s 没离开页面就给提示（每个按钮独立文案） ── */
  function bindAdd(buttonId, appName, manualText) {
    var btn = document.getElementById(buttonId);
    var hint = document.getElementById('add-hint');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var t0 = Date.now();
      setTimeout(function () {
        if (Date.now() - t0 < 2000 && !document.hidden) {
          hint.textContent = '没反应？请确认已安装 ' + appName + '；也可以' + manualText + '。';
          hint.classList.add('show');
        }
      }, 1600);
    });
  }
  bindAdd('add-sileo', 'Sileo', '在 Sileo 里手动「添加源」粘贴地址');
  bindAdd('add-irisin', 'Irisin', '在 Irisin 的源页面点「+」粘贴地址');

  /* ── 复制源地址 ── */
  var toast = document.getElementById('toast');
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }
  document.getElementById('copy-btn').addEventListener('click', function () {
    var url = 'https://MrSuuu.github.io/Sileo';
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = url; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast('已复制源地址'); }
      catch (e) { showToast('复制失败，请手动长按地址'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { showToast('已复制源地址'); }, fallback);
    } else { fallback(); }
  });

  /* ── 解析源索引，渲染插件列表（永远读最新 Packages，加包自动出现） ── */
  function parsePackages(text) {
    var out = [], block = {};
    text.split(/\r?\n/).forEach(function (line) {
      if (/^\s*$/.test(line)) {
        if (block.Package) out.push(block);
        block = {};
        return;
      }
      var i = line.indexOf(':');
      if (i > 0 && !/^\s/.test(line)) block[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    });
    if (block.Package) out.push(block);
    return out;
  }

  function versionRank(v) {
    // "+rootless" 之类的后缀降权，让主线版本优先展示
    var main = v.replace(/\+.*$/, '');
    var nums = main.replace(/[^0-9.]/g, '.').split('.').filter(Boolean).map(Number);
    while (nums.length < 4) nums.push(0);
    return nums;
  }
  function cmpVer(a, b) {
    var A = versionRank(a), B = versionRank(b);
    for (var i = 0; i < 4; i++) { if (A[i] !== B[i]) return B[i] - A[i]; }
    var aIsRootless = /rootless/.test(a), bIsRootless = /rootless/.test(b);
    if (aIsRootless !== bIsRootless) return aIsRootless ? 1 : -1;
    return a < b ? 1 : (a > b ? -1 : 0);
  }

  function hueFor(id) {
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 360;
    return h;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(pkgs) {
    var list = document.getElementById('pkg-list');
    var groups = {};
    pkgs.forEach(function (p) {
      (groups[p.Package] = groups[p.Package] || []).push(p);
    });

    var cards = Object.keys(groups).map(function (id) {
      var entries = groups[id];
      entries.sort(function (a, b) { return cmpVer(a.Version || '', b.Version || ''); });
      var main = entries[0];
      var versions = [];
      entries.forEach(function (e) {
        if (e.Version && versions.indexOf(e.Version) === -1) versions.push(e.Version);
      });
      var name = main.Name || id;
      var desc = (main.Description || '').split('\n')[0];
      var hue = hueFor(id);
      var avatar = 'linear-gradient(135deg, hsl(' + hue + ' 72% 55%), hsl(' + ((hue + 60) % 360) + ' 72% 45%))';
      var finalUrl = 'https://MrSuuu.github.io/Sileo';
      var depiction = main.Depiction || (finalUrl + '/depictions/' + id.split('.').pop() + '.html');
      // 保留 Packages 里带的 ?v= 缓存破除参数（depiction 更新时会随之提升）

      var chips = versions.slice(0, 4).map(function (v) {
        var cls = /rootless/.test(v) ? 'chip' : 'chip acc';
        return '<span class="' + cls + '">' + esc(v) + '</span>';
      }).join('');

      return '<a class="pkg" href="' + esc(depiction) + '">' +
        '<div class="pkg-head">' +
          '<div class="avatar" style="background:' + avatar + '">' + esc(name.slice(0, 1)) + '</div>' +
          '<div><div class="pkg-name">' + esc(name) + '</div><div class="pkg-id">' + esc(id) + '</div></div>' +
        '</div>' +
        (desc ? '<div class="pkg-desc">' + esc(desc) + '</div>' : '') +
        '<div class="chips">' + chips + '</div>' +
      '</a>';
    });
    list.innerHTML = cards.join('') || '<div class="loading">源里暂时没有插件</div>';
  }

  fetch('Packages?v=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (text) { render(parsePackages(text)); })
    .catch(function () {
      document.getElementById('pkg-list').innerHTML =
        '<div class="error">插件列表加载失败。<br>请刷新重试，或直接<a href="sileo://source/https://MrSuuu.github.io/Sileo">在 Sileo 中打开源</a>。</div>';
    });
})();
</script>
</body>
</html>
