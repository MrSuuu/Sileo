<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>去拨号键盘背景</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px 18px 44px;
    background: #1c1c1e; color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 14px; letter-spacing: 0.2px; }
  .desc { font-size: 15px; line-height: 1.65; color: #ebebf5cc; margin-bottom: 30px; white-space: pre-wrap; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 22px; }
  .cell .label { font-size: 13px; color: #ebebf599; margin-bottom: 6px; font-weight: 400; }
  .cell .value { font-size: 22px; color: #ffffff; font-weight: 500; line-height: 1.2; }
  .footer { margin-top: 38px; padding-top: 18px; border-top: 1px solid #ffffff14; font-size: 12px; color: #ebebf566; text-align: center; }
</style>
</head>
<body>
  <h1>去拨号键盘背景</h1>
  <div class="desc">把「电话」App 拨号键盘里的数字圆底和绿色呼叫键背景变透明，只留下数字与电话图标。重开「电话」App 即生效。</div>
  <div class="grid">
    <div class="cell"><div class="label">开发者</div><div class="value">泽哥</div></div>
    <div class="cell"><div class="label">更新时间</div><div class="value">2026-10-26 13:20:00</div></div>
    <div class="cell"><div class="label">当前版本</div><div class="value">1.0.3</div></div>
    <div class="cell"><div class="label">插件大小</div><div class="value">11 KB</div></div>
    <div class="cell"><div class="label">架构</div><div class="value">arm64e / arm64</div></div>
    <div class="cell"><div class="label">系统兼容</div><div class="value">iOS 15.0 +</div></div>
  </div>
  <div class="footer">泽哥源 · 静态托管</div>
</body>
</html>
