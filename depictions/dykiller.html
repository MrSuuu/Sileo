<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYKiller iOS17 兼容版 - 详情</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f2f2f7; color: #333; }
    .card { background: white; border-radius: 12px; padding: 20px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .meta { color: #888; font-size: 13px; margin-bottom: 16px; }
    .version { display: inline-block; background: #007AFF; color: white; border-radius: 6px; padding: 2px 8px; font-size: 12px; }
    .desc { line-height: 1.6; }
    .warn { background: #FFF3CD; border-left: 4px solid #FFC107; padding: 12px; border-radius: 4px; font-size: 14px; }
    .compat { background: #D4EDDA; border-left: 4px solid #28A745; padding: 12px; border-radius: 4px; font-size: 14px; margin: 12px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DYKiller iOS 17 兼容版</h1>
    <div class="meta">
      包名：com.hierarch.dykiller &nbsp;|&nbsp;
      版本：<span class="version">0.5.8-ios17compat30-fixed</span>
    </div>
    <div class="desc">
      <div class="compat">
        ✅ 适配 iOS 17，支持 iPhone 15 Pro / arm64e
      </div>
      <p><strong>功能：</strong></p>
      <ul>
        <li>抖音液态玻璃效果（毛玻璃降级）</li>
        <li>评论页半透明磨砂</li>
        <li>分享面板磨砂背景</li>
        <li>设置面板可见</li>
      </ul>
      <div class="warn">
        ⚠️ 需要越狱 + roothide 环境。arm64e 架构。
      </div>
    </div>
  </div>
</body>
</html>
